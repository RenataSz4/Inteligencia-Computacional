<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predictive Maintenance - Engine Health</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <path d="M3 13h4v3H3z" fill="#0b5fff" />
          <path d="M8 10h8v7H8z" fill="#0b5fff" />
          <circle cx="18.5" cy="15.5" r="1.5" fill="#0b5fff" />
          <path d="M14 7h4v3h-4z" fill="#0b5fff" />
        </svg>
        <span class="logo-text">Engine</span>
      </div>
    </div>
    <div class="search-container">
      <input id="search" type="search" placeholder="Search vehicles..." />
    </div>
    <div class="add-container">
      <button id="addBtn">Add</button>
    </div>
  </header>

  <main>
    <section class="list-section">
      <table id="vehiclesTable">
        <thead>
          <tr>
            <th>Vehicle Name</th>
            <th>Owner Name</th>
            <th>Engine RPM</th>
            <th>Lubrication Oil Pressure</th>
            <th>Fuel Pressure</th>
            <th>Coolant Pressure</th>
            <th>Lubrication Oil Temperature</th>
            <th>Coolant Temperature</th>
            <th>Engine Maintenance</th>
            <th>Confidence</th>
          </tr>
        </thead>
        <tbody id="vehiclesBody">
          <!-- rows will be appended here -->
        </tbody>
      </table>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Add Vehicle</h2>
      <form id="addForm">
        <label>Vehicle name
          <input name="vehicle" required />
        </label>
        <label>Owner name
          <input name="owner" required />
        </label>
        <label>Engine RPM
          <input name="Engine_rpm" type="number" step="1" required />
        </label>
        <label>Lubrication Oil Pressure
          <input name="Lub_oil_pressure" type="number" step="0.01" required />
        </label>
        <label>Fuel Pressure
          <input name="Fuel_pressure" type="number" step="0.01" required />
        </label>
        <label>Coolant Pressure
          <input name="Coolant_pressure" type="number" step="0.01" required />
        </label>
        <label>Lubrication Oil Temperature
          <input name="lub_oil_temp" type="number" step="0.1" required />
        </label>
        <label>Coolant Temperature
          <input name="Coolant_temp" type="number" step="0.1" required />
        </label>
        <div class="form-actions">
          <button type="submit">Confirm</button>
          <button id="cancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
